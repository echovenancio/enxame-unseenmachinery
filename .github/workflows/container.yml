name: Container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Run Godot tests in the build environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: tests
          cache-from: type=gha,scope=godot-tests
          cache-to: type=gha,mode=max,scope=godot-tests
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: enxame:test
          cache-from: |
            type=gha,scope=godot-tests
            type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Validate HTTP, WASM, downloads and health check
        run: |
          docker run -d --name enxame-test -p 127.0.0.1:8080:8080 enxame:test
          python3 tools/test_container.py
          docker exec enxame-test nginx -t
          test "$(docker exec enxame-test id -u)" != 0
          for attempt in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' enxame-test)
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs enxame-test || true
          docker rm -f enxame-test || true

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Publish validated image (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
