server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Export filenames are reused on every release: revalidate to avoid mixing builds.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/octet-stream application/json text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ \.wasm(\.part[0-9]+)?$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
